name: test-hooks

# Runs every hook self-check (`*/hooks/*.test.sh`) via scripts/test-hooks.sh.
#
# No `paths:` filter on purpose: the suite runs in under a second, and a filter
# is one more thing that can be wrong — a glob that misses a new plugin's hooks/
# directory would let a broken hook merge green. Cheap enough to always run.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run hook tests
        run: bash scripts/test-hooks.sh
