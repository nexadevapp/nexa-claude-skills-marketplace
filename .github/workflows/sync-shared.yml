name: shared-sync

# Guards the cross-plugin shared gate files: every stack plugin (nexa-claude-nextjs,
# nexa-claude-go, ...) must hold byte-identical copies of the readiness/tracking files it
# references from nexa-claude-core. Fails if the copies drift, or if a skill references a
# shared file that exists in neither core nor the stack plugin.

on:
  pull_request:
    paths:
      - 'nexa-claude-*/shared/**'
      - 'nexa-claude-*/skills/**'
      - 'scripts/sync-shared.sh'
      - '.github/workflows/sync-shared.yml'
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify shared gate files are in sync
        run: bash scripts/sync-shared.sh --check
